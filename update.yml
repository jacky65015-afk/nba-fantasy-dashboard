name: NBA Fantasy - Taiwan Time and Live Data

on:
  schedule:
    - cron: '13 */4 * * *'
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Full or live update'
        required: true
        default: full
        type: choice
        options:
          - full
          - live

permissions:
  contents: write

concurrency:
  group: nba-fantasy-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch NBA data
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          REQUEST_MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "schedule" && "$SCHEDULE" == "7,22,37,52 * * * *" ]]; then
            python update_data.py --live
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUEST_MODE" == "live" ]]; then
            python update_data.py --live
          else
            python update_data.py
          fi

      - name: Commit updated data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nba.json
          if git diff --cached --quiet; then
            echo 'No data changes.'
            exit 0
          fi
          git commit -m 'Auto-update NBA data'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo 'Updated NBA data pushed successfully.'
              exit 0
            fi
            echo "Push rejected on attempt ${attempt}; retrying."
            sleep 3
          done
          echo 'Push failed after three attempts.' >&2
          exit 1
